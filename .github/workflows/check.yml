name: Kitchen checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build_data.py
      - run: python tools/build_page.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/core.test.cjs tests/household.test.cjs
      - run: git diff --exit-code -- data/data.json index.html sw.js
